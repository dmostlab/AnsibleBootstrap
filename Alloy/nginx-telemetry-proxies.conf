# ============================================================================
# nginx vhost: Prometheus Remote Write Proxy
# ============================================================================
# Proxies inbound remote-write requests from Alloy agents to Prometheus
# running on 127.0.0.1:9090. Requires --web.enable-remote-write-receiver
# on the Prometheus side.
#
# Drop this into your nginx_config Ansible role as a vhost template, or
# place directly in /etc/nginx/conf.d/prometheus-write-proxy.conf
#
# PREREQUISITES:
#   1. Enable remote write receiver on Prometheus:
#      --web.enable-remote-write-receiver
#
#   2. Generate htpasswd file:
#      htpasswd -cB /etc/nginx/.htpasswd-prometheus alloy
#
#   3. TLS cert (Let's Encrypt, internal CA, or your existing wildcard)
# ============================================================================

server {
    listen 443 ssl http2;
    server_name prometheus-write.yourdomain.com;

    # --- TLS (swap these for your cert paths or Jinja2 snippet include) ---
    # {% include "snippets/ssl.conf.j2" %}
    ssl_certificate     /etc/nginx/ssl/prometheus-write.yourdomain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/prometheus-write.yourdomain.com.key;

    # --- Security headers snippet ---
    # {% include "snippets/security-headers.conf.j2" %}
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Basic auth ---
    auth_basic "Prometheus Write";
    auth_basic_user_file /etc/nginx/.htpasswd-prometheus;

    # --- Only allow the remote write endpoint ---
    location /api/v1/write {
        # Proxy to Prometheus on loopback
        proxy_pass http://127.0.0.1:9090/api/v1/write;

        # --- Proxy headers snippet ---
        # {% include "snippets/proxy-headers.conf.j2" %}
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remote write payloads are snappy-compressed protobufs, not large
        # but allow headroom for batch writes
        client_max_body_size 10m;

        # Timeouts aligned with Alloy's queue config
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Deny everything else — this is a write-only proxy
    location / {
        return 403;
    }

    # Health check endpoint for monitoring the proxy itself
    location /nginx-health {
        access_log off;
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/prometheus-write-proxy-access.log;
    error_log  /var/log/nginx/prometheus-write-proxy-error.log warn;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name prometheus-write.yourdomain.com;
    return 301 https://$host$request_uri;
}


# ============================================================================
# nginx vhost: Loki Push Proxy
# ============================================================================
# Proxies inbound log push requests from Alloy agents to Loki.
# Same pattern — TLS termination + basic auth at the nginx layer.
#
# PREREQUISITES:
#   1. Generate htpasswd file:
#      htpasswd -cB /etc/nginx/.htpasswd-loki alloy
#
#   2. TLS cert for the Loki vhost
# ============================================================================

server {
    listen 443 ssl http2;
    server_name loki.yourdomain.com;

    # --- TLS ---
    # {% include "snippets/ssl.conf.j2" %}
    ssl_certificate     /etc/nginx/ssl/loki.yourdomain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/loki.yourdomain.com.key;

    # --- Security headers ---
    # {% include "snippets/security-headers.conf.j2" %}
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Basic auth ---
    auth_basic "Loki Push";
    auth_basic_user_file /etc/nginx/.htpasswd-loki;

    # --- Loki push endpoint ---
    location /loki/api/v1/push {
        proxy_pass http://127.0.0.1:3100/loki/api/v1/push;

        # --- Proxy headers ---
        # {% include "snippets/proxy-headers.conf.j2" %}
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Log batches can be larger than metric writes
        client_max_body_size 20m;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Optional: expose Loki's ready endpoint for health checks (no auth)
    location /ready {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100/ready;
    }

    # Deny everything else
    location / {
        return 403;
    }

    location /nginx-health {
        access_log off;
        auth_basic off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/loki-push-proxy-access.log;
    error_log  /var/log/nginx/loki-push-proxy-error.log warn;
}

server {
    listen 80;
    server_name loki.yourdomain.com;
    return 301 https://$host$request_uri;
}
