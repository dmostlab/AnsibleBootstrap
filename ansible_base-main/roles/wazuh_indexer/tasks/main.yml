- name: Disable Wazuh repository after install (APT)
  ansible.builtin.apt_repository:
    repo: "{{ wazuh_indexer_repo_apt }}"
    filename: wazuh
    state: absent
  when:
    - ansible_facts['os_family'] == "Debian"
    - wazuh_indexer_disable_repo_after_install | bool

- name: Disable Wazuh repository after install (RPM)
  ansible.builtin.lineinfile:
    path: /etc/yum.repos.d/wazuh.repo
    regexp: '^enabled='
    line: 'enabled=0'
  when:
    - ansible_facts['os_family'] == "RedHat"
    - wazuh_indexer_disable_repo_after_install | bool

- name: Ensure firewalld is installed (RPM)
  ansible.builtin.package:
    name: firewalld
    state: present
  when:
    - ansible_facts['os_family'] == "RedHat"
    - (wazuh_indexer_firewalld_manage | default(true)) | bool

- name: Ensure firewalld is running (RPM)
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when:
    - ansible_facts['os_family'] == "RedHat"
    - (wazuh_indexer_firewalld_manage | default(true)) | bool

- name: Open Wazuh indexer firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ wazuh_indexer_firewalld_ports }}"
  when:
    - ansible_facts['os_family'] == "RedHat"
    - (wazuh_indexer_firewalld_manage | default(true)) | bool
